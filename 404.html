<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Motter Cloud</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f3f0;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border2: rgba(0,0,0,0.11);
      --text: #111010;
      --text2: #4a4845;
      --text3: #8a8784;
      --accent: #2a6cf6;
      --accent2: #1a55d8;
      --accent-glow: rgba(42,108,246,0.15);
      --accent-soft: rgba(42,108,246,0.07);
      --nav-bg: rgba(244,243,240,0.85);
      --t: 0.26s cubic-bezier(0.4,0,0.2,1);
    }

    [data-theme="dark"] {
      --bg: #0b0c0f;
      --surface: #15171c;
      --surface2: #1c1f26;
      --border: rgba(255,255,255,0.055);
      --border2: rgba(255,255,255,0.09);
      --text: #efefef;
      --text2: #a0a0aa;
      --text3: #60606a;
      --accent: #4a8bff;
      --accent2: #2a6cf6;
      --accent-glow: rgba(74,139,255,0.18);
      --accent-soft: rgba(74,139,255,0.09);
      --nav-bg: rgba(11,12,15,0.85);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      display: flex; flex-direction: column;
      transition: background var(--t), color var(--t);
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px; opacity: 0.6;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 62px; display: flex; align-items: center;
      padding: 0 clamp(1.25rem, 5vw, 3rem);
      background: var(--nav-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1140px; width: 100%; margin: 0 auto;
      display: flex; align-items: center;
    }

    .nav-logo {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none; color: var(--text);
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
    }
    .nav-logo img { width: 28px; height: 28px; object-fit: contain; border-radius: 7px; }

    .theme-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border2); background: var(--surface);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text2); transition: all var(--t); margin-left: auto;
    }
    .theme-btn:hover { background: var(--surface2); color: var(--text); }
    .theme-btn svg { width: 15px; height: 15px; }

    /* MAIN */
    main {
      flex: 1; position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 6rem 2rem 4rem; text-align: center;
    }

    .glow {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      width: 400px; height: 300px;
      background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 68%);
      pointer-events: none; animation: gp 5s ease-in-out infinite;
    }

    @keyframes gp {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    .content { position: relative; z-index: 1; max-width: 480px; }

    .big-num {
      font-family: 'Syne', sans-serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800; line-height: 1;
      letter-spacing: -0.06em;
      color: var(--accent); opacity: 0.12;
      margin-bottom: -0.5rem;
      user-select: none;
    }

    .err-icon {
      width: 52px; height: 52px; border-radius: 15px;
      background: var(--accent-soft); border: 1px solid var(--accent-glow);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); margin: 0 auto 1.25rem;
    }
    .err-icon svg { width: 24px; height: 24px; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800; letter-spacing: -0.03em;
      color: var(--text); margin-bottom: 0.75rem;
    }

    p { color: var(--text2); font-size: 0.95rem; line-height: 1.7; margin-bottom: 2rem; }

    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      text-decoration: none; font-family: inherit;
      font-size: 0.85rem; font-weight: 600;
      padding: 9px 18px; border-radius: 9px;
      border: none; cursor: pointer; transition: all var(--t);
    }
    .btn svg { width: 14px; height: 14px; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover {
      background: var(--accent2); transform: translateY(-1px);
      box-shadow: 0 5px 18px var(--accent-glow);
    }

    .btn-ghost {
      background: transparent; color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }

    /* FOOTER */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 1.5rem clamp(1.25rem, 5vw, 3rem);
    }

    .footer-row {
      max-width: 1140px; margin: 0 auto;
      display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
    }

    .footer-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--text);
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
    }
    .footer-logo img { width: 22px; height: 22px; object-fit: contain; border-radius: 6px; }

    .footer-copy { color: var(--text3); font-size: 0.78rem; }

    @media (max-width: 500px) {
      .footer-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="https://public-blob.squarecloud.dev/28fbc8894137ced089811faa1dd3e7d88b3a4fb0/aaaa/aaaa_mpqby11g-add2176765b5f394deab5ea7bb363b77.png" alt="Motter Cloud" />
      Motter Cloud
    </a>
    <button class="theme-btn" id="themeToggle" aria-label="Alternar tema">
      <i data-lucide="sun"></i>
    </button>
  </div>
</nav>

<main>
  <div class="glow"></div>
  <div class="content">
    <div class="big-num">404</div>
    <div class="err-icon"><i data-lucide="search-x"></i></div>
    <h1>Página não encontrada</h1>
    <p>Esta página não existe ou foi movida. Volte ao início ou acesse o suporte caso precise de ajuda.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary"><i data-lucide="home"></i> Voltar ao início</a>
      <a href="/suporte" class="btn btn-ghost"><i data-lucide="life-buoy"></i> Suporte</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-row">
    <a href="/" class="footer-logo">
      <img src="https://public-blob.squarecloud.dev/28fbc8894137ced089811faa1dd3e7d88b3a4fb0/aaaa/aaaa_mpqby11g-add2176765b5f394deab5ea7bb363b77.png" alt="Motter Cloud" />
      Motter Cloud
    </a>
    <span class="footer-copy">© 2026 Motter Cloud</span>
  </div>
</footer>

<script>
  lucide.createIcons();
  const root = document.documentElement;
  const tbtn = document.getElementById('themeToggle');
  const applyTheme = t => {
    root.setAttribute('data-theme', t);
    tbtn.innerHTML = t === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    lucide.createIcons();
  };
  applyTheme(localStorage.getItem('mc-theme') || 'dark');
  tbtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('mc-theme', next);
    applyTheme(next);
  });
</script>
</body>
</html>
