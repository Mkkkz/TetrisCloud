<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada | Motter Cloud</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f3f0; --surface: #ffffff; --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.12); --text: #111010; --text2: #4a4845;
      --text3: #7a7774; --accent: #2a6cf6; --accent2: #1a55d8;
      --accent-glow: rgba(42,108,246,0.18); --accent-soft: rgba(42,108,246,0.08);
      --nav-bg: rgba(244,243,240,0.82); --transition: 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg: #0b0c0f; --surface: #15171c; --surface2: #1c1f26;
      --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.10);
      --text: #f0eff0; --text2: #a8a7b0; --text3: #65636e;
      --accent: #4a8bff; --accent2: #2a6cf6;
      --accent-glow: rgba(74,139,255,0.20); --accent-soft: rgba(74,139,255,0.10);
      --nav-bg: rgba(11,12,15,0.82);
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      display: flex; flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px; opacity: 0.5;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 64px;
      display: flex; align-items: center; padding: 0 clamp(1rem, 5vw, 3rem);
      background: var(--nav-bg); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); transition: all var(--transition);
    }
    .nav-inner { max-width: 1200px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 2rem; }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem;
    }
    .nav-logo img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; }
    .theme-toggle {
      width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border2);
      background: var(--surface); cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text2);
      transition: all var(--transition); margin-left: auto;
    }
    .theme-toggle svg { width: 16px; height: 16px; }

    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 7rem 2rem 4rem; position: relative; z-index: 1;
    }
    .err-glow {
      position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
      width: 400px; height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .err-content { position: relative; z-index: 1; max-width: 560px; }
    .err-num {
      font-family: 'Syne', sans-serif; font-size: clamp(6rem, 16vw, 10rem);
      font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -0.06em;
      opacity: 0.15; margin-bottom: 0.5rem;
    }
    .err-icon {
      width: 60px; height: 60px; border-radius: 18px;
      background: var(--accent-soft); border: 1px solid var(--accent-glow);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); margin: 0 auto 1.5rem;
    }
    .err-icon svg { width: 28px; height: 28px; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800;
      letter-spacing: -0.03em; color: var(--text); margin-bottom: 1rem;
    }
    p { color: var(--text2); font-size: 1rem; line-height: 1.7; margin-bottom: 2.5rem; }
    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
      padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer;
      transition: all 0.28s; font-family: inherit;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border2); }
    .btn-secondary:hover { transform: translateY(-2px); }

    footer {
      position: relative; z-index: 1; background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1.5rem clamp(1rem, 5vw, 3rem); text-align: center;
    }
    footer p { font-size: 0.8rem; color: var(--text3); }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="https://public-blob.squarecloud.dev/28fbc8894137ced089811faa1dd3e7d88b3a4fb0/aaaa/aaaa_mpqby11g-add2176765b5f394deab5ea7bb363b77.png" alt="Motter Cloud" />
      Motter Cloud
    </a>
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
      <i data-lucide="sun"></i>
    </button>
  </div>
</nav>

<main>
  <div class="err-glow"></div>
  <div class="err-content">
    <div class="err-num">404</div>
    <div class="err-icon"><i data-lucide="search-x"></i></div>
    <h1>Pagina nao encontrada</h1>
    <p>A pagina que voce procura nao existe ou foi movida. Volte para o inicio ou acesse um dos links abaixo.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary"><i data-lucide="home"></i> Voltar ao inicio</a>
      <a href="/suporte" class="btn btn-secondary"><i data-lucide="life-buoy"></i> Suporte</a>
    </div>
  </div>
</main>

<footer>
  <p>© 2025 Motter Cloud. Todos os direitos reservados.</p>
</footer>

<script>
  lucide.createIcons();
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const apply = (t) => {
    root.setAttribute('data-theme', t);
    btn.innerHTML = t === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    lucide.createIcons();
  };
  apply(localStorage.getItem('mc-theme') || 'dark');
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('mc-theme', next);
    apply(next);
  });
</script>
</body>
</html>
